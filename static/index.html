<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outreach Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0F0F13;
    --card: #1A1A20;
    --card2: #242430;
    --border: #2E2E3A;
    --text: #EDEDEC;
    --muted: #A8A8A4;
    --dim: #737373;
    --gold: #E0A860;
    --gold-dim: #C4842A;
    --green: #4CAF7D;
    --red: #E05555;
    --blue: #5588E0;
    --radius: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
    flex: 1;
  }

  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--red);
    transition: background 0.3s;
  }
  .status-dot.running { background: var(--green); animation: pulse 1.5s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .status-label {
    font-size: 12px;
    color: var(--muted);
    min-width: 60px;
  }

  /* ── BUTTONS ── */
  .btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  .btn-gold { background: var(--gold); color: #1A1100; }
  .btn-green { background: var(--green); color: #0A1F14; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-blue { background: var(--blue); color: #fff; }
  .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }

  /* ── MAIN ── */
  main { max-width: 1280px; margin: 0 auto; padding: 24px; }

  /* ── STATS ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
  }

  .stat-val {
    font-size: 32px;
    font-weight: 800;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-lbl {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ── PIPELINE CONTROLS ── */
  .pipeline-bar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .pipeline-bar .stage-text {
    flex: 1;
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }

  .tab-btn {
    padding: 10px 20px;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s;
  }

  .tab-btn.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── SEARCH ── */
  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
  }

  .search-input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-input:focus { border-color: var(--gold); }
  .search-input::placeholder { color: var(--dim); }

  /* ── QUEUE ── */
  .queue-list { display: flex; flex-direction: column; gap: 8px; }

  .queue-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.15s;
  }

  .queue-item:hover { border-color: var(--gold-dim); }

  .queue-header {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    cursor: pointer;
    gap: 12px;
    user-select: none;
  }

  .queue-name {
    font-weight: 700;
    font-size: 15px;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .queue-meta {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .queue-tag {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .queue-expand-icon {
    color: var(--dim);
    font-size: 12px;
    transition: transform 0.2s;
  }

  .queue-item.expanded .queue-expand-icon { transform: rotate(180deg); }

  .queue-body {
    display: none;
    padding: 0 16px 16px;
    border-top: 1px solid var(--border);
  }

  .queue-item.expanded .queue-body { display: block; }

  .email-preview {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin: 12px 0;
  }

  .email-subject {
    font-weight: 700;
    font-size: 13px;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .email-body-text {
    font-size: 13px;
    color: var(--text);
    white-space: pre-wrap;
    line-height: 1.6;
  }

  .queue-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  /* ── VARIANTS ── */
  .variants-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 12px 0;
  }

  @media (max-width: 900px) {
    .variants-grid { grid-template-columns: 1fr; }
  }

  .variant-card {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .variant-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--gold);
    text-transform: uppercase;
  }

  .variant-subject {
    font-weight: 700;
    font-size: 13px;
    color: var(--text);
  }

  .variant-body {
    font-size: 12px;
    color: var(--muted);
    white-space: pre-wrap;
    line-height: 1.6;
    flex: 1;
  }

  .spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── SENT TABLE ── */
  .sent-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .sent-table th {
    text-align: left;
    padding: 10px 14px;
    color: var(--muted);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    background: var(--card);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .sent-table td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    max-width: 300px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sent-table tr:hover td { background: var(--card2); }

  /* ── PAGINATION ── */
  .pagination {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    justify-content: center;
  }

  .page-info {
    font-size: 13px;
    color: var(--muted);
    min-width: 100px;
    text-align: center;
  }

  /* ── TOAST ── */
  #toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 9999;
  }

  .toast {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 13px;
    color: var(--text);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    animation: slideIn 0.2s ease;
    max-width: 320px;
  }

  .toast.success { border-left: 3px solid var(--green); }
  .toast.error { border-left: 3px solid var(--red); }
  .toast.info { border-left: 3px solid var(--gold); }

  @keyframes slideIn {
    from { transform: translateX(20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 15px;
  }

  .empty-state span { font-size: 36px; display: block; margin-bottom: 12px; }

  /* ── LOADING ── */
  .loading-row {
    text-align: center;
    padding: 40px;
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>📧 Outreach Dashboard</h1>
  <div class="status-dot" id="status-dot"></div>
  <span class="status-label" id="status-label">Idle</span>
  <button class="btn btn-ghost" onclick="syncGithub()">⬆ Sync GitHub</button>
</header>

<main>
  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-val" id="stat-collected">—</div>
      <div class="stat-lbl">Total Collected</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-sent">—</div>
      <div class="stat-lbl">Total Sent</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-pending">—</div>
      <div class="stat-lbl">Queued (Ready)</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-today">—</div>
      <div class="stat-lbl">Sent Today</div>
    </div>
  </div>

  <!-- PIPELINE CONTROLS -->
  <div class="pipeline-bar">
    <button class="btn btn-green" id="btn-scrape" onclick="pipelineAction('scrape')">▶ Scrape New Leads</button>
    <button class="btn btn-gold" id="btn-send" onclick="pipelineAction('send')">📤 Send 450 Emails</button>
    <button class="btn btn-red btn-sm" id="btn-stop" onclick="pipelineAction('stop')">⏹ Stop</button>
    <span class="stage-text" id="stage-text">Ready</span>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('queue', this)">📋 Queue</button>
    <button class="tab-btn" onclick="switchTab('sent', this)">✉ Sent History</button>
  </div>

  <!-- QUEUE TAB -->
  <div id="tab-queue" class="tab-panel active">
    <div class="search-row">
      <input class="search-input" type="text" id="search-input" placeholder="Search by business name, category, city…" oninput="debounceSearch()">
      <span id="queue-count" style="color:var(--muted);font-size:12px;white-space:nowrap;"></span>
    </div>
    <div id="queue-list" class="queue-list">
      <div class="loading-row"><span class="spinner"></span></div>
    </div>
    <div class="pagination" id="queue-pagination" style="display:none">
      <button class="btn btn-ghost btn-sm" id="queue-prev" onclick="queueChangePage(-1)">← Prev</button>
      <span class="page-info" id="queue-page-info"></span>
      <button class="btn btn-ghost btn-sm" id="queue-next" onclick="queueChangePage(1)">Next →</button>
    </div>
  </div>

  <!-- SENT TAB -->
  <div id="tab-sent" class="tab-panel">
    <div id="sent-content">
      <div class="loading-row"><span class="spinner"></span></div>
    </div>
    <div class="pagination" id="sent-pagination" style="display:none">
      <button class="btn btn-ghost btn-sm" id="sent-prev" onclick="sentChangePage(-1)">← Prev</button>
      <span class="page-info" id="sent-page-info"></span>
      <button class="btn btn-ghost btn-sm" id="sent-next" onclick="sentChangePage(1)">Next →</button>
    </div>
  </div>
</main>

<div id="toast-container"></div>

<script>
// ── STATE ─────────────────────────────────────────────────────────
const state = {
  queuePage: 1,
  queuePages: 1,
  queueSearch: '',
  sentPage: 1,
  sentPages: 1,
  pipelineRunning: false,
  expandedEmail: null,
  variantStates: {}, // keyed by email
};

let searchTimer = null;
let statsTimer = null;
let statusTimer = null;

// ── API ───────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type': 'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  return res.json();
}

// ── TOAST ─────────────────────────────────────────────────────────
function toast(msg, type = 'info') {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ── STATS ─────────────────────────────────────────────────────────
async function loadStats() {
  try {
    const d = await api('GET', '/api/stats');
    document.getElementById('stat-collected').textContent = d.total_collected.toLocaleString();
    document.getElementById('stat-sent').textContent = d.total_sent.toLocaleString();
    document.getElementById('stat-pending').textContent = d.pending.toLocaleString();
    document.getElementById('stat-today').textContent = d.sent_today.toLocaleString();
    updatePipelineStatus(d.pipeline_running, d.pipeline_stage);
  } catch(e) { console.warn('Stats error', e); }
}

function updatePipelineStatus(running, stage) {
  state.pipelineRunning = running;
  const dot = document.getElementById('status-dot');
  const lbl = document.getElementById('status-label');
  const stageText = document.getElementById('stage-text');

  dot.className = 'status-dot' + (running ? ' running' : '');
  lbl.textContent = running ? 'Running' : 'Idle';
  stageText.textContent = running ? `Stage: ${stage}` : 'Ready';

  const btnScrape = document.getElementById('btn-scrape');
  const btnSend = document.getElementById('btn-send');
  btnScrape.disabled = running;
  btnSend.disabled = running;
}

// ── PIPELINE ─────────────────────────────────────────────────────
async function pipelineAction(action) {
  if (action !== 'stop' && state.pipelineRunning) {
    toast('Pipeline is already running', 'error'); return;
  }
  try {
    const d = await api('POST', `/api/pipeline/${action}`);
    toast(d.msg || (d.ok ? 'Done' : 'Failed'), d.ok ? 'success' : 'error');
    loadStats();
    if (d.ok && action !== 'stop') startStatusPolling();
  } catch(e) { toast('Request failed', 'error'); }
}

function startStatusPolling() {
  clearInterval(statusTimer);
  statusTimer = setInterval(async () => {
    const d = await api('GET', '/api/pipeline/status');
    updatePipelineStatus(d.running, d.stage);
    if (!d.running) {
      clearInterval(statusTimer);
      loadStats();
      loadQueue();
    }
  }, 5000);
}

// ── GITHUB SYNC ───────────────────────────────────────────────────
async function syncGithub() {
  toast('Syncing with GitHub…', 'info');
  try {
    const d = await api('POST', '/api/sync');
    toast(d.msg || (d.ok ? 'Synced!' : 'Sync failed'), d.ok ? 'success' : 'error');
  } catch(e) { toast('Sync request failed', 'error'); }
}

// ── TABS ──────────────────────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'sent') loadSent();
}

// ── QUEUE ─────────────────────────────────────────────────────────
function debounceSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.queueSearch = document.getElementById('search-input').value;
    state.queuePage = 1;
    loadQueue();
  }, 350);
}

async function loadQueue() {
  const el = document.getElementById('queue-list');
  el.innerHTML = '<div class="loading-row"><span class="spinner"></span></div>';

  try {
    const params = new URLSearchParams({ page: state.queuePage, limit: 20, search: state.queueSearch });
    const d = await api('GET', `/api/queue?${params}`);

    state.queuePages = d.pages;
    document.getElementById('queue-count').textContent = `${d.total.toLocaleString()} emails queued`;

    if (!d.rows || !d.rows.length) {
      el.innerHTML = '<div class="empty-state"><span>📭</span>No emails in queue</div>';
      document.getElementById('queue-pagination').style.display = 'none';
      return;
    }

    el.innerHTML = '';
    d.rows.forEach(row => el.appendChild(buildQueueItem(row)));

    // Update pagination
    const pag = document.getElementById('queue-pagination');
    pag.style.display = 'flex';
    document.getElementById('queue-page-info').textContent = `Page ${d.page} of ${d.pages}`;
    document.getElementById('queue-prev').disabled = d.page <= 1;
    document.getElementById('queue-next').disabled = d.page >= d.pages;
  } catch(e) {
    el.innerHTML = '<div class="empty-state"><span>⚠️</span>Failed to load queue</div>';
  }
}

function queueChangePage(delta) {
  state.queuePage = Math.max(1, Math.min(state.queuePages, state.queuePage + delta));
  loadQueue();
}

function buildQueueItem(row) {
  const email = row['To Email'] || '';
  const name = row['Business Name'] || '';
  const cat = row['Category'] || '';
  const city = row['City'] || '';
  const state_ = row['State'] || '';
  const rating = row['Rating'] ? `⭐ ${parseFloat(row['Rating']).toFixed(1)}` : '';
  const subject = row['Subject'] || '';
  const body = row['Email Body'] || '';

  const item = document.createElement('div');
  item.className = 'queue-item';
  item.dataset.email = email;

  item.innerHTML = `
    <div class="queue-header" onclick="toggleQueueItem(this.parentElement)">
      <div class="queue-name">${esc(name)}</div>
      <span class="queue-tag">${esc(cat)}</span>
      <span class="queue-meta">${esc(city)}${state_ ? ', '+state_ : ''}</span>
      ${rating ? `<span class="queue-meta">${rating}</span>` : ''}
      <span class="queue-meta" style="color:var(--dim);font-size:11px;">${esc(email)}</span>
      <span class="queue-expand-icon">▼</span>
    </div>
    <div class="queue-body">
      <div class="email-preview" id="preview-${esc(email)}">
        <div class="email-subject">${esc(subject)}</div>
        <div class="email-body-text">${esc(body)}</div>
      </div>
      <div id="variants-${safeId(email)}"></div>
      <div class="queue-actions">
        <button class="btn btn-blue btn-sm" onclick="generateVariants(event, ${JSON.stringify(row)})">🔄 Generate Variants</button>
        <button class="btn btn-green btn-sm" onclick="approveEmail(event, ${JSON.stringify(email)}, ${JSON.stringify(subject)}, ${JSON.stringify(body)})">✓ Approve</button>
        <button class="btn btn-ghost btn-sm" onclick="skipEmail(event, ${JSON.stringify(email)})">✗ Skip</button>
      </div>
    </div>
  `;

  return item;
}

function toggleQueueItem(item) {
  item.classList.toggle('expanded');
}

function safeId(email) {
  return email.replace(/[@.]/g, '_');
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function generateVariants(event, row) {
  event.stopPropagation();
  const email = row['To Email'];
  const containerId = `variants-${safeId(email)}`;
  const container = document.getElementById(containerId);
  const btn = event.target;

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Generating…';
  container.innerHTML = '';

  try {
    const d = await api('POST', '/api/generate-variants', {
      business_name: row['Business Name'] || '',
      category: row['Category'] || '',
      city: row['City'] || '',
      state: row['State'] || '',
      website: row['Website'] || '',
      rating: row['Rating'] || '',
      reviews: row['Reviews'] || '',
    });

    if (!d.variants || !d.variants.length) {
      toast('No variants returned — check Groq API key', 'error');
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'variants-grid';

    d.variants.forEach(v => {
      const card = document.createElement('div');
      card.className = 'variant-card';
      card.innerHTML = `
        <div class="variant-label">Variant ${v.variant}</div>
        <div class="variant-subject">${esc(v.subject)}</div>
        <div class="variant-body">${esc(v.body)}</div>
        <button class="btn btn-gold btn-sm" style="margin-top:auto" onclick="useVariant(event, '${esc(email)}', '${esc(v.subject).replace(/'/g,"\\'")}', this)">Use This</button>
      `;
      // Store body on the button for retrieval
      card.querySelector('button').dataset.body = v.body;
      card.querySelector('button').dataset.subject = v.subject;
      grid.appendChild(card);
    });

    container.appendChild(grid);
    toast('3 variants generated', 'success');
  } catch(e) {
    toast('Variant generation failed', 'error');
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🔄 Generate Variants';
  }
}

function useVariant(event, email, subject, btn) {
  event.stopPropagation();
  const body = btn.dataset.body;
  const sub = btn.dataset.subject;

  // Update the preview
  const preview = document.getElementById(`preview-${esc(email)}`);
  if (preview) {
    preview.querySelector('.email-subject').textContent = sub;
    preview.querySelector('.email-body-text').textContent = body;
  }

  // Auto-approve with selected variant
  approveEmailDirect(email, sub, body);
}

async function approveEmail(event, email, subject, body) {
  event.stopPropagation();
  await approveEmailDirect(email, subject, body);
}

async function approveEmailDirect(email, subject, body) {
  try {
    const d = await api('POST', '/api/approve', { email, subject, body });
    if (d.ok) {
      toast(`✓ Approved — ${email}`, 'success');
      // Remove the item from view after a moment
      setTimeout(() => {
        const item = document.querySelector(`.queue-item[data-email="${CSS.escape(email)}"]`);
        if (item) item.style.opacity = '0.3';
      }, 400);
    } else {
      toast('Approve failed', 'error');
    }
  } catch(e) { toast('Request failed', 'error'); }
}

async function skipEmail(event, email) {
  event.stopPropagation();
  if (!confirm(`Skip and remove ${email}?`)) return;
  try {
    const d = await api('POST', '/api/skip', { email });
    if (d.ok) {
      toast(`Skipped ${email}`, 'info');
      const item = document.querySelector(`.queue-item[data-email="${CSS.escape(email)}"]`);
      if (item) item.remove();
      loadQueue();
    }
  } catch(e) { toast('Skip failed', 'error'); }
}

// ── SENT HISTORY ──────────────────────────────────────────────────
async function loadSent() {
  const container = document.getElementById('sent-content');
  container.innerHTML = '<div class="loading-row"><span class="spinner"></span></div>';

  try {
    const params = new URLSearchParams({ page: state.sentPage, limit: 30 });
    const d = await api('GET', `/api/sent?${params}`);

    state.sentPages = d.pages;

    if (!d.rows || !d.rows.length) {
      container.innerHTML = '<div class="empty-state"><span>📭</span>No emails sent yet</div>';
      document.getElementById('sent-pagination').style.display = 'none';
      return;
    }

    const table = document.createElement('table');
    table.className = 'sent-table';
    table.innerHTML = `
      <thead><tr>
        <th>Business Name</th>
        <th>Email</th>
        <th>Subject</th>
        <th>Sent At</th>
      </tr></thead>
      <tbody>
        ${d.rows.map(r => `
          <tr>
            <td title="${esc(r['Business Name'])}">${esc(r['Business Name'] || '—')}</td>
            <td>${esc(r['To Email'] || '—')}</td>
            <td title="${esc(r['Subject'])}">${esc(r['Subject'] || '—')}</td>
            <td>${esc(r['Sent At'] || '—')}</td>
          </tr>
        `).join('')}
      </tbody>
    `;
    container.innerHTML = '';
    container.appendChild(table);

    const pag = document.getElementById('sent-pagination');
    pag.style.display = 'flex';
    document.getElementById('sent-page-info').textContent = `Page ${d.page} of ${d.pages} (${d.total.toLocaleString()} total)`;
    document.getElementById('sent-prev').disabled = d.page <= 1;
    document.getElementById('sent-next').disabled = d.page >= d.pages;
  } catch(e) {
    container.innerHTML = '<div class="empty-state"><span>⚠️</span>Failed to load sent history</div>';
  }
}

function sentChangePage(delta) {
  state.sentPage = Math.max(1, Math.min(state.sentPages, state.sentPage + delta));
  loadSent();
}

// ── INIT ─────────────────────────────────────────────────────────
async function init() {
  await loadStats();
  await loadQueue();

  // Auto-refresh stats every 30s
  statsTimer = setInterval(loadStats, 30000);
}

init();
</script>
